name: bikerskz

services:
  app:
    image: ${APP_IMAGE:-bikerskz:0.1.0}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      BASE_URL: ${BASE_URL:?Set BASE_URL in .env}
      DATABASE_URL: postgres://bikerskz:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/bikerskz?sslmode=disable
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
      OTP_DAILY_BUDGET: ${OTP_DAILY_BUDGET:-1000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      PORT: "8080"
      WEB_DIST_DIR: /app/web
      MEDIA_DIR: /var/lib/bikerskz/media
      TZ: Asia/Almaty
    ports:
      - "0.0.0.0:${APP_PORT:-3042}:8080"
    volumes:
      - media:/var/lib/bikerskz/media
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: bikerskz
      POSTGRES_DB: bikerskz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/18/docker
      TZ: Asia/Almaty
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres:
  media:
